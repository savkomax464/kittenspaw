<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kittenspaw | Запись</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        iosBg: '#FCF8F9',
                        iosCard: '#FFFFFF',
                        iosPink: '#FF2D55',
                        iosPinkSoft: '#FFD4DE',
                        iosText: '#1D1D1F',
                        iosGray: '#86868B',
                    },
                    boxShadow: {
                        'apple': '0 4px 24px rgba(0, 0, 0, 0.04)',
                        'apple-btn': '0 4px 14px 0 rgba(255, 45, 85, 0.2)',
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; background-color: #FCF8F9; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .apple-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
        }
        .btn-press:active { transform: scale(0.96); }
        .card-press:active { transform: scale(0.98); }
        .nav-view { transition: transform 0.3s ease, opacity 0.3s ease; }
        .view-left { transform: translateX(-100%); position: absolute; top: 0; opacity: 0; pointer-events: none; }
        .view-center { transform: translateX(0); position: relative; opacity: 1; }
        .view-right { transform: translateX(100%); position: absolute; top: 0; opacity: 0; pointer-events: none; }
        .nav-container { position: relative; overflow: hidden; width: 100%; }
        .chevron { transition: transform 0.3s; }
        .chevron.open { transform: rotate(180deg); }
        .category-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
        }
        .category-content.open { grid-template-rows: 1fr; }
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease; }
    </style>
</head>
<body class="text-iosText antialiased pb-32">

    <!-- Навигация -->
    <nav class="sticky top-0 z-50 apple-glass">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex space-x-4 text-[14px] font-medium text-iosGray">
                <a href="#services" class="hover:text-iosPink transition">Услуги</a>
                <a href="#portfolio" class="hover:text-iosPink transition">Работы</a>
                <a href="#booking" class="hover:text-iosPink transition">Запись</a>
            </div>
            <a href="#booking" class="bg-iosPink text-white px-4 py-1.5 rounded-full text-[13px] font-semibold btn-press">Записаться</a>
        </div>
    </nav>

    <!-- Заголовок -->
    <header class="flex flex-col items-center justify-center text-center px-6 pt-12 pb-8">
        <div class="w-28 h-28 mb-4 rounded-full overflow-hidden shadow-apple border-2 border-iosPinkSoft">
            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400" alt="Мастер" class="w-full h-full object-cover" id="master-photo">
        </div>
        <h1 class="text-[28px] font-bold mb-2" id="studio-name">Kittenspaw</h1>
        <p class="text-[15px] text-iosGray" id="studio-desc">Идеальный маникюр. Безопасность. Носка до 4-х недель.</p>
    </header>

    <!-- Услуги (динамические) -->
    <section id="services" class="px-4 py-4">
        <h2 class="text-[20px] font-bold mb-3 px-2">Услуги</h2>
        <div id="services-container" class="space-y-2">
            <div class="text-center py-8 text-iosGray">Загрузка...</div>
        </div>
    </section>

    <!-- Портфолио (динамическое) -->
    <section id="portfolio" class="px-4 py-4">
        <h2 class="text-[20px] font-bold mb-3 px-2">Наши работы</h2>
        <div id="portfolio-container" class="space-y-3">
            <div class="text-center py-8 text-iosGray">Загрузка...</div>
        </div>
    </section>

    <!-- Адрес (динамический) -->
    <section id="address" class="px-4 py-4">
        <h2 class="text-[20px] font-bold mb-3 px-2">Адрес</h2>
        <div class="bg-iosCard rounded-[20px] p-4 shadow-apple">
            <p class="text-[15px] text-iosGray" id="address-text">Загрузка...</p>
            <a id="map-link" href="#" target="_blank" class="inline-block mt-3 text-iosPink font-medium">🗺 Показать на карте</a>
        </div>
    </section>

    <!-- Запись -->
    <section id="booking" class="px-4 py-4">
        <h2 class="text-[20px] font-bold mb-3 px-2">Запись</h2>
        <div class="bg-iosCard rounded-[20px] p-4 shadow-apple nav-container min-h-[400px]">
            
            <!-- Шаг 1: Дата -->
            <div id="view-dates" class="nav-view view-center">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[18px] font-bold" id="month-display">Месяц</h3>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 bg-iosPinkSoft text-iosPink rounded-full btn-press">❮</button>
                        <button onclick="changeMonth(1)" class="w-8 h-8 bg-iosPinkSoft text-iosPink rounded-full btn-press">❯</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] text-iosGray mb-2">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="text-iosPink">Сб</div><div class="text-iosPink">Вс</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 justify-items-center"></div>
            </div>

            <!-- Шаг 2: Услуга -->
            <div id="view-services" class="nav-view view-right">
                <button onclick="backToDates()" class="text-iosPink mb-3 btn-press flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Назад
                </button>
                <h3 class="text-[24px] font-bold mb-1" id="selected-date">Дата</h3>
                <p class="text-[13px] text-iosGray mb-3">Выберите услугу</p>
                <div id="services-grid" class="space-y-2"></div>
            </div>

            <!-- Шаг 3: Время -->
            <div id="view-times" class="nav-view view-right">
                <button onclick="backToServices()" class="text-iosPink mb-3 btn-press flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Назад
                </button>
                <h3 class="text-[18px] font-bold mb-1" id="selected-service">Услуга</h3>
                <p class="text-[13px] text-iosGray mb-3">Выберите время</p>
                <div id="times-grid" class="grid grid-cols-3 gap-2"></div>
            </div>
        </div>
    </section>

    <!-- Связаться -->
    <section class="px-4 py-4">
        <h2 class="text-[20px] font-bold mb-3 px-2">Связаться</h2>
        <div class="bg-iosCard rounded-[20px] p-4 shadow-apple">
            <textarea id="manager-message" rows="3" placeholder="Ваше сообщение..." class="w-full p-3 rounded-[16px] border border-iosPink/10 bg-black/5 text-[15px] focus:outline-none focus:ring-2 focus:ring-iosPink/30 resize-none"></textarea>
            <button onclick="sendToManager()" class="w-full mt-3 bg-iosPink text-white py-3 rounded-[18px] font-semibold btn-press">Отправить</button>
        </div>
    </section>

    <!-- Соцсети -->
    <section class="px-4 py-4 pb-8">
        <div class="flex justify-center gap-4">
            <a href="#" id="instagram-link" class="w-12 h-12 rounded-full bg-iosPink text-white flex items-center justify-center btn-press">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            </a>
        </div>
    </section>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.textColor = "#FFFFFF";
        tg.MainButton.color = "#FF2D55";

        // API URL - заменяем на ваш Cloudflare Worker
        const API_URL = 'https://kittenspaw-bot.savkomax8.workers.dev';

        // Данные
        let settings = {};
        let services = [];
        let portfolio = [];
        let timeSlots = [];
        let daysOff = [];
        
        let currentDate = new Date();
        let selectedDate = null;
        let selectedService = null;
        let selectedTime = null;

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const monthNamesGen = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

        // Загрузка данных
        async function loadData() {
            try {
                const [settingsRes, servicesRes, portfolioRes, scheduleRes, daysOffRes] = await Promise.all([
                    fetch(`${API_URL}/api/settings`),
                    fetch(`${API_URL}/api/services`),
                    fetch(`${API_URL}/api/portfolio`),
                    fetch(`${API_URL}/api/schedule`),
                    fetch(`${API_URL}/api/days-off`)
                ]);

                settings = await settingsRes.json();
                services = await servicesRes.json();
                portfolio = await portfolioRes.json();
                const schedule = await scheduleRes.json();
                timeSlots = schedule.slots || [];
                daysOff = await daysOffRes.json();

                // Применяем настройки
                document.getElementById('studio-name').textContent = settings.studio_name || 'Kittenspaw';
                document.getElementById('studio-desc').textContent = settings.studio_desc || 'Идеальный маникюр';
                document.getElementById('address-text').textContent = settings.studio_address || 'Адрес не указан';
                document.getElementById('map-link').href = settings.studio_map_url || '#';
                document.getElementById('instagram-link').href = settings.instagram_url || '#';

                // Рендерим
                renderServices();
                renderPortfolio();
                renderCalendar();
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        // Рендер услуг
        function renderServices() {
            const container = document.getElementById('services-container');
            if (services.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-iosGray">Нет услуг</div>';
                return;
            }
            container.innerHTML = services.map(s => `
                <div class="bg-iosCard rounded-[16px] p-3 shadow-apple flex justify-between items-center">
                    <div>
                        <h3 class="text-[15px] font-semibold">${s.name}</h3>
                        <p class="text-[12px] text-iosGray">${s.description || ''} • ${s.duration_slots}ч</p>
                    </div>
                    <span class="text-[15px] font-medium text-iosPink">${s.price} ₽</span>
                </div>
            `).join('');
        }

        // Рендер портфолио
        function renderPortfolio() {
            const container = document.getElementById('portfolio-container');
            if (portfolio.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-iosGray">Нет работ</div>';
                return;
            }
            container.innerHTML = portfolio.map((cat, i) => `
                <div class="bg-iosCard rounded-[18px] shadow-apple overflow-hidden">
                    <button class="w-full px-4 py-3 flex justify-between items-center card-press" onclick="toggleCategory('cat-${i}')">
                        <span class="text-[16px] font-semibold">${cat.name}</span>
                        <svg class="chevron w-5 h-5 text-iosGray" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="cat-${i}" class="category-content">
                        <div class="px-4 pb-4 grid grid-cols-2 gap-2">
                            ${cat.images.map(img => `<img src="${img.file_url || 'https://via.placeholder.com/200'}" class="w-full h-32 object-cover rounded-[12px]">`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCategory(id) {
            document.getElementById(id).classList.toggle('open');
        }

        // Календарь
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('month-display').textContent = `${monthNames[month]} ${year}`;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const maxDate = new Date(today);
            maxDate.setMonth(maxDate.getMonth() + 2);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let offset = firstDay === 0 ? 6 : firstDay - 1;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for (let i = 0; i < offset; i++) grid.innerHTML += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                
                const isPast = dateObj < today;
                const isTooFar = dateObj > maxDate;
                const isDayOff = daysOff.includes(dateStr);
                const isDisabled = isPast || isTooFar || isDayOff;

                let btnClass = "w-9 h-9 flex items-center justify-center rounded-full text-[14px] ";
                if (isDisabled) {
                    btnClass += "text-black/20 cursor-not-allowed";
                } else {
                    btnClass += "text-iosText hover:bg-iosPinkSoft btn-press cursor-pointer";
                }

                grid.innerHTML += `<button class="${btnClass}" ${isDisabled ? 'disabled' : `onclick="goToServices('${dateStr}', ${day}, ${month})"`}>${day}</button>`;
            }
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function goToServices(dateStr, day, month) {
            selectedDate = dateStr;
            selectedTime = null;
            tg.MainButton.hide();

            document.getElementById('selected-date').textContent = `${day} ${monthNamesGen[month]}`;
            
            const grid = document.getElementById('services-grid');
            grid.innerHTML = services.map(s => `
                <button onclick="goToTimes('${s.name}', ${s.duration_slots})" class="w-full text-left p-3 rounded-[16px] border border-black/5 bg-iosCard btn-press">
                    <h4 class="text-[15px] font-semibold">${s.name}</h4>
                    <p class="text-[12px] text-iosGray">${s.duration_slots}ч • ${s.price} ₽</p>
                </button>
            `).join('');

            document.getElementById('view-dates').className = "nav-view view-left";
            document.getElementById('view-services').className = "nav-view view-center";
        }

        function backToDates() {
            selectedDate = null;
            tg.MainButton.hide();
            document.getElementById('view-dates').className = "nav-view view-center";
            document.getElementById('view-services').className = "nav-view view-right";
        }

        function goToTimes(serviceName, duration) {
            selectedService = serviceName;
            selectedTime = null;
            tg.MainButton.hide();

            document.getElementById('selected-service').textContent = serviceName;
            
            const grid = document.getElementById('times-grid');
            grid.innerHTML = timeSlots.map(slot => `
                <button onclick="selectTime('${slot.time}', ${duration})" class="py-2 rounded-[12px] text-[14px] bg-iosPinkSoft/40 text-iosPink btn-press border border-iosPink/10">
                    ${slot.time}
                </button>
            `).join('');

            document.getElementById('view-services').className = "nav-view view-left";
            document.getElementById('view-times').className = "nav-view view-center";
        }

        function backToServices() {
            selectedTime = null;
            tg.MainButton.hide();
            document.getElementById('view-times').className = "nav-view view-right";
            document.getElementById('view-services').className = "nav-view view-center";
        }

        function selectTime(time, duration) {
            document.querySelectorAll('#times-grid button').forEach(b => {
                b.className = "py-2 rounded-[12px] text-[14px] bg-iosPinkSoft/40 text-iosPink btn-press border border-iosPink/10";
            });
            event.target.className = "py-2 rounded-[12px] text-[14px] bg-iosPink text-white font-bold btn-press shadow-apple-btn";
            
            selectedTime = time;
            tg.MainButton.setText(`ЗАПИСАТЬСЯ: ${time}`);
            tg.MainButton.show();
        }

        // Отправка записи
        tg.MainButton.onClick(() => {
            const user = tg.initDataUnsafe?.user || {};
            const payload = {
                user_id: user.id,
                client_name: user.first_name || 'Клиент',
                service: selectedService,
                date: selectedDate,
                time: selectedTime,
                duration: selectedService ? services.find(s => s.name === selectedService)?.duration_slots || 1 : 1
            };

            fetch(`${API_URL}/api/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(data => {
                if (data.ok) {
                    tg.showAlert('✅ Вы записаны!');
                    tg.MainButton.hide();
                    backToDates();
                } else {
                    tg.showAlert('❌ Ошибка: ' + (data.error || 'Неизвестная'));
                }
            });
        });

        // Отправка сообщения
        function sendToManager() {
            const message = document.getElementById('manager-message').value.trim();
            if (!message) {
                tg.showAlert('Введите сообщение');
                return;
            }

            const user = tg.initDataUnsafe?.user || {};
            fetch(`${API_URL}/api/contact`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: user.id,
                    client_name: user.first_name || 'Клиент',
                    message
                })
            }).then(r => r.json()).then(data => {
                if (data.ok) {
                    tg.showAlert('✅ Отправлено!');
                    document.getElementById('manager-message').value = '';
                }
            });
        }

        // Запуск
        loadData();
    </script>
</body>
</html>
